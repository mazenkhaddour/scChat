name: scchat-backend
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  # Core single-cell stack
  - scanpy>=1.10
  - anndata>=0.10
  - leidenalg>=0.10
  - python-igraph>=0.11
  # Numerics
  - numpy>=1.26
  - pandas>=2.2
  - scipy>=1.13
  # Plotting (headless — only used for saving figures to workspace)
  - matplotlib>=3.8
  - seaborn>=0.13
  - pip:
    # Agentic pipeline
    - langgraph==0.1.19
    - langchain==0.2.6
    # LLM / HTTP
    - httpx==0.27.0
    # Utilities
    - loguru==0.7.2
